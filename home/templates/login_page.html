<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Almirah Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: white;
}

/* HEADER */
.header {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 15px 40px;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  background: linear-gradient(45deg, #7f5af0, #2cb67d);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* CENTER CONTAINER */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 80px);
}

/* LOGIN BOX */
.login-box {
  width: 380px;
  padding: 30px;
  border-radius: 16px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 25px rgba(127,90,240,0.2);
  text-align: center;
  animation: fadeIn 0.6s ease;
}

/* IMAGE */
.login-box img {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 15px;
}

/* TITLE */
.login-box h2 {
  font-size: 20px;
  margin-bottom: 20px;
}

.login-box h2 span {
  color: #7f5af0;
}

/* INPUT */
.input-field {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: none;
  border-radius: 10px;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

.input-field::placeholder {
  color: rgba(255,255,255,0.6);
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(45deg, #7f5af0, #2cb67d);
  color: white;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  opacity: 0.85;
}

/* TERMS */
.terms {
  font-size: 12px;
  margin-top: 10px;
  color: rgba(255,255,255,0.7);
}

.terms span {
  color: #7f5af0;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">Almirah</div>
</header>

<!-- LOGIN -->
<div class="container">
  <div class="login-box">

    <img src="https://via.placeholder.com/380x160" alt="Login Banner">

    <h2>Login <span>or Signup</span></h2>

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      <input type="text" name="mobile" class="input-field"
             placeholder="Enter Mobile Number" required>

      <button type="submit" class="btn">CONTINUE</button>
    </form>

    <p class="terms">
      By continuing, you agree to our <span>Terms & Privacy Policy</span>
    </p>

  </div>
</div>

</body>
</html>
