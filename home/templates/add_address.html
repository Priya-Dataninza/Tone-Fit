<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Address - Almirah</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0b0f1a, #111827);
  color: #e5e7eb;
}

/* HEADER */
.header {
  background: #0f172a;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  border-bottom: 1px solid #1e293b;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  background: linear-gradient(90deg, #3b82f6, #a855f7);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav {
  display: flex;
  gap: 20px;
}

.nav a {
  text-decoration: none;
  color: #cbd5e1;
  font-weight: bold;
  transition: 0.3s;
}

.nav a:hover {
  color: #3b82f6;
}

/* FORM CONTAINER */
.container {
  max-width: 600px;
  margin: 50px auto;
}

.card {
  background: #0f172a;
  padding: 30px;
  border-radius: 12px;
  border: 1px solid #1e293b;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

/* TITLE */
h2 {
  margin-bottom: 15px;
  color: #93c5fd;
}

/* INPUTS */
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #334155;
  border-radius: 8px;
  font-size: 14px;
  background: #111827;
  color: #e5e7eb;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 8px #3b82f6;
}

/* ROW */
.row {
  display: flex;
  gap: 10px;
}

.row input {
  flex: 1;
}

/* BUTTON */
.btn {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border: none;
  background: linear-gradient(90deg, #3b82f6, #a855f7);
  color: white;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  opacity: 0.9;
  transform: scale(1.02);
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Almirah</div>

  <div class="nav">
    <a href="{% url 'home' %}">Home</a>
    <a href="#">Orders</a>
    <a href="{% url 'profile' %}">Profile</a>
  </div>
</header>

<div class="container">
<div class="card">

<h2>Add New Address</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="name" placeholder="Full Name" required>
<input type="text" name="phone" placeholder="Mobile Number" required>

<input type="text" name="house" placeholder="House No, Building Name" required>
<input type="text" name="area" placeholder="Road name, Area, Colony" required>

<div class="row">
  <input type="text" name="city" placeholder="City" required>
  <input type="text" name="state" placeholder="State" required>
</div>

<input type="text" name="pincode" placeholder="Pincode" required>

<button type="submit" class="btn">Save Address</button>

</form>

</div>
</div>

</body>
</html>
