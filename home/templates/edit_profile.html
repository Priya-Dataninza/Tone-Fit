<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Profile - Almirah</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: white;
}

/* HEADER */
.header {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  padding: 15px 40px;
  position: sticky;
  top: 0;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  background: linear-gradient(45deg, #7f5af0, #2cb67d);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* CONTAINER */
.container {
  max-width: 450px;
  margin: 60px auto;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(127,90,240,0.2);
  text-align: center;
}

/* TITLE */
h2 {
  margin-bottom: 20px;
  color: #7f5af0;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

input::placeholder {
  color: rgba(255,255,255,0.6);
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(45deg, #7f5af0, #2cb67d);
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  opacity: 0.85;
}

/* SELECT STYLING */
select {
  cursor: pointer;
}

/* SMALL ANIMATION */
.card {
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Almirah</div>
</div>

<!-- FORM -->
<div class="container">
  <div class="card">

    <h2>Edit Profile</h2>

    <form method="POST">
      {% csrf_token %}

      <input type="text" name="name" value="{{ user.name }}" placeholder="Full Name">

      <select name="gender">
        <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
      </select>

      <input type="number" name="age" value="{{ user.age }}" placeholder="Age">

      <button type="submit" class="btn">Save Changes</button>

    </form>

  </div>
</div>

</body>
</html>
